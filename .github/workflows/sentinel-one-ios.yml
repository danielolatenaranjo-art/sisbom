name: Build and Upload iOS (SENTINEL ONE)
# Trigger Release: App Store Connect / TestFlight

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'DEV/SENTINEL ONE/ios/**'
      - 'DEV/MiSisBom/iOS/**'
      - '.github/workflows/sentinel-one-ios.yml'

permissions:
  contents: write

jobs:
  build-and-upload-ios:
    name: Build & Deploy SENTINEL ONE
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode: '16'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Locate iOS Directory
        id: locate-ios
        run: |
          if [ -d "DEV/SENTINEL ONE/ios" ]; then
            echo "ios_path=DEV/SENTINEL ONE/ios" >> $GITHUB_OUTPUT
          elif [ -d "DEV/MiSisBom/iOS" ]; then
            echo "ios_path=DEV/MiSisBom/iOS" >> $GITHUB_OUTPUT
          elif [ -d "MiSisBom/iOS" ]; then
            echo "ios_path=MiSisBom/iOS" >> $GITHUB_OUTPUT
          elif [ -d "iOS" ]; then
            echo "ios_path=iOS" >> $GITHUB_OUTPUT
          else
            echo "ios_path=." >> $GITHUB_OUTPUT
          fi

      - name: Instalar Certificados y Perfil de Aprovisionamiento
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(security cms -D -i "$PP_PATH"))
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "Perfil instalado con UUID: $UUID"

      - name: Generate Xcode Project
        run: |
          cd "${{ steps.locate-ios.outputs.ios_path }}"
          xcodegen generate

      - name: Install Pods
        run: |
          cd "${{ steps.locate-ios.outputs.ios_path }}"
          pod install --repo-update

      - name: Generar ExportOptions.plist
        run: |
          cd "${{ steps.locate-ios.outputs.ios_path }}"
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>destination</key>
              <string>export</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>teamID</key>
              <string>NFR3L3CC3L</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.misisbom.sisbom.NFR3L3CC3L</key>
                  <string>SENTINEL_ONE_AppStore</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Archivar y Exportar IPA Oficial
        run: |
          cd "${{ steps.locate-ios.outputs.ios_path }}"
          
          xcodebuild archive \
            -workspace SisBom.xcworkspace \
            -scheme SisBom \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SisBom.xcarchive" \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="NFR3L3CC3L" \
            PROVISIONING_PROFILE_SPECIFIER="SENTINEL_ONE_AppStore" \
            CODE_SIGN_IDENTITY="Apple Distribution"

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SisBom.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/build_output"

          mkdir -p output
          cp $RUNNER_TEMP/build_output/*.ipa output/SENTINEL_ONE.ipa
          echo "IPA generado con éxito en output/SENTINEL_ONE.ipa"

      - name: Subir IPA a App Store Connect
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$APPSTORE_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${APPSTORE_KEY_ID}.p8

          xcrun altool --upload-app \
            -f "${{ steps.locate-ios.outputs.ios_path }}/output/SENTINEL_ONE.ipa" \
            -t ios \
            --apiKey "$APPSTORE_KEY_ID" \
            --apiIssuer "$APPSTORE_ISSUER_ID"

      - name: Upload iOS IPA Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SENTINEL-ONE-iOS-IPA
          path: ${{ steps.locate-ios.outputs.ios_path }}/output/SENTINEL_ONE.ipa

      - name: Limpiar llavero temporal
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
