name: Build iOS App (MiSisBom)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd MiSisBom/iOS
          xcodegen generate

      - name: Resolve Package Dependencies
        run: |
          cd MiSisBom/iOS
          xcodebuild -resolvePackageDependencies -project SisBom.xcodeproj -scheme SisBom

      - name: Build iOS Application (Simulator / Unsigned)
        run: |
          cd MiSisBom/iOS
          xcodebuild build \
            -project SisBom.xcodeproj \
            -scheme SisBom \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Build Outputs
        run: |
          cd MiSisBom/iOS
          mkdir -p Payload
          if [ -d "build/Build/Products/Release-iphonesimulator/SisBom.app" ]; then
            cp -r build/Build/Products/Release-iphonesimulator/SisBom.app Payload/
          fi
          zip -r SisBom_iOS_App.zip Payload/ SisBom.xcodeproj

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiSisBom-iOS-Build
          path: MiSisBom/iOS/SisBom_iOS_App.zip
