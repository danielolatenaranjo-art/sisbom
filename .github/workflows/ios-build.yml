name: Build iOS App (MiSisBom)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd MiSisBom/iOS
          xcodegen generate

      - name: Resolve Swift Package Dependencies
        run: |
          cd MiSisBom/iOS
          xcodebuild -resolvePackageDependencies -project SisBom.xcodeproj

      - name: Build iOS App (Simulator)
        run: |
          cd MiSisBom/iOS
          xcodebuild build \
            -project SisBom.xcodeproj \
            -scheme SisBom \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create App Payload Artifact
        run: |
          cd MiSisBom/iOS
          mkdir -p Payload
          APP_PATH=$(find build -name "SisBom.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
          fi
          zip -r SisBom_iOS_App.zip Payload/ SisBom.xcodeproj

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiSisBom-iOS-Build
          path: MiSisBom/iOS/SisBom_iOS_App.zip
