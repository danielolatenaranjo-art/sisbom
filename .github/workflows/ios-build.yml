name: Build iOS App (MiSisBom)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode: '16'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd MiSisBom/iOS
          xcodegen generate

      - name: Install Pods
        run: |
          cd MiSisBom/iOS
          pod install --repo-update

      - name: Build iOS Application
        run: |
          cd MiSisBom/iOS
          xcodebuild build \
            -workspace SisBom.xcworkspace \
            -scheme SisBom \
            -sdk iphoneos \
            -configuration Release \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO > build.log 2>&1 || true

          if grep -q "\*\* BUILD SUCCEEDED \*\*" build.log; then
            echo "Build Succeeded!"
          else
            echo "=== EXTRACTED COMPILER ERRORS ==="
            grep -E "(error:|fatal error:)" build.log || tail -n 50 build.log
            ERR_MSG=$(grep -E "(error:|fatal error:)" build.log | head -n 5 | tr '\n' ' ')
            if [ -z "$ERR_MSG" ]; then
              ERR_MSG=$(tail -n 20 build.log | tr '\n' ' ')
            fi
            echo "::error title=Xcode Compilation Error::$ERR_MSG"
            exit 1
          fi

      - name: Create Clean IPA Artifact
        run: |
          cd MiSisBom/iOS
          rm -rf Payload SisBom.ipa
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "SisBom.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
          else
            echo "Error: SisBom.app not found in DerivedData"
            exit 1
          fi
          zip -r SisBom.ipa Payload
          echo "SisBom.ipa created successfully."

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiSisBom-iOS-IPA
          path: MiSisBom/iOS/SisBom.ipa
