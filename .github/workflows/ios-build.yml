name: Build iOS App (MiSisBom)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Xcode 16
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode: '16'

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          cd MiSisBom/iOS
          xcodegen generate

      - name: Install Pods
        run: |
          cd MiSisBom/iOS
          pod install --repo-update

      - name: Build iOS Application
        run: |
          cd MiSisBom/iOS
          xcodebuild clean build \
            -workspace SisBom.xcworkspace \
            -scheme SisBom \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO > build.log 2>&1 || (echo "=== LAST 150 LINES OF BUILD LOG ==="; tail -n 150 build.log; exit 1)

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XcodeBuild-Log
          path: MiSisBom/iOS/build.log

      - name: Create Clean IPA Artifact
        run: |
          cd MiSisBom/iOS
          rm -rf Payload SisBom.ipa
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "SisBom.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" Payload/
          else
            echo "Error: SisBom.app not found in DerivedData"
            exit 1
          fi
          zip -r SisBom.ipa Payload
          echo "SisBom.ipa created successfully."

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiSisBom-iOS-IPA
          path: MiSisBom/iOS/SisBom.ipa
