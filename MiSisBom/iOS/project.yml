name: SisBom
options:
  bundleIdPrefix: com.misisbom
  objectVersion: 56
  deploymentTarget:
    iOS: "15.0"
targets:
  SisBom:
    type: application
    platform: iOS
    sources:
      - path: Models
      - path: Views
      - path: ViewModels
      - path: Services
      - path: Resources
      - path: SisBomApp.swift
      - path: Assets.xcassets
      - path: GoogleService-Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misisbom.sisbom
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "miSisBom"
        CFBundleShortVersionString: "2.1.0"
        CFBundleVersion: "10"
        UILaunchScreen: {}
        UIBackgroundModes:
          - fetch
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            UIPrerenderedIcon: false
          CFBundleAlternateIcons:
            SB-CBPL-OH:
              CFBundleIconFiles:
                - SB-CBPL-OH
              UIPrerenderedIcon: false
            PRUEBA:
              CFBundleIconFiles:
                - PRUEBA
              UIPrerenderedIcon: false
