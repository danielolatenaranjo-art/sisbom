name: SisBom
options:
  bundleIdPrefix: com.misisbom
  deploymentTarget:
    iOS: "15.0"
targets:
  SisBom:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - iOS_Setup_Guide.md
          - generate_icons.py
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misisbom.sisbom
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      plist:
        CFBundleDisplayName: "SisBom"
        CFBundleShortVersionString: "1.0.7"
        CFBundleVersion: "8"
        UILaunchScreen: {}
        UIBackgroundModes:
          - fetch
          - remote-notification
    dependencies:
      - package: firebase-ios-sdk
        product: FirebaseCore
      - package: firebase-ios-sdk
        product: FirebaseAuth
      - package: firebase-ios-sdk
        product: FirebaseFirestore
      - package: firebase-ios-sdk
        product: FirebaseMessaging

packages:
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.0.0
