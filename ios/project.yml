name: SisBom
options:
  bundleIdPrefix: com.misisbom
  objectVersion: 56
  deploymentTarget:
    iOS: "15.0"
targets:
  SisBom:
    type: application
    platform: iOS
    sources:
      - path: Resources/www
        type: folder
      - path: Resources/alerta.mp3
      - path: Resources/alertas.mp3
      - path: Resources/c10_0.mp3
      - path: Resources/c10_1.mp3
      - path: Resources/c10_2.mp3
      - path: Resources/c10_3.mp3
      - path: Resources/c10_4.mp3
      - path: Resources/c10_5.mp3
      - path: Resources/c10_6.mp3
      - path: Resources/c10_7.mp3
      - path: Resources/c10_8.mp3
      - path: Resources/c10_9.mp3
      - path: Resources/c10_10.mp3
      - path: Resources/c10_12.mp3
      - path: Resources/c10_15.mp3
      - path: Resources/c10_30.mp3
      - path: Resources/c9_0.mp3
      - path: Resources/despacho.mp3
      - path: Resources/importante.mp3
      - path: Resources/llamado_comandancia.mp3
      - path: Resources/llamadocomandancia.mp3
      - path: SisBomApp.swift
      - path: Assets.xcassets
      - path: GoogleService-Info.plist
      - path: LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.misisbom.sisbom.NFR3L3CC3L
        DEVELOPMENT_TEAM: NFR3L3CC3L
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "SENTINEL_ONE_AppStore"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "SENTINEL ONE"
        CFBundleShortVersionString: "3.0.3"
        CFBundleVersion: "3004"
        UILaunchStoryboardName: LaunchScreen
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - remote-notification
          - audio
          - location
        NSLocationWhenInUseUsageDescription: "SENTINEL ONE requiere acceso a su ubicación para calcular distancias a emergencias y coordinar al personal."
        NSLocationAlwaysAndWhenInUseUsageDescription: "SENTINEL ONE requiere acceso permanente a su ubicación para alertas de despacho y seguimiento de emergencias en tiempo real."
        NSLocationAlwaysUsageDescription: "SENTINEL ONE requiere acceso permanente a su ubicación para alertas de despacho y seguimiento de emergencias en tiempo real."
        NSCameraUsageDescription: "SENTINEL ONE requiere acceso a la cámara para adjuntar fotografías en reportes y bitácora de emergencias."
        NSPhotoLibraryUsageDescription: "SENTINEL ONE requiere acceso a la galería para adjuntar imágenes a reportes de servicio y bitácora."
        ITSAppUsesNonExemptEncryption: false
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            UIPrerenderedIcon: false
