<!DOCTYPE html>
<html lang="es">
<head>
    <script src="./libs/sisbom-sync.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Sirena - SisBom</title>
    <link rel="icon" href="Logo.png" type="image/png">
    
    <link rel="stylesheet" href="./libs/tailwind.css">
    <link href="./libs/font-awesome/css/all.min.css" rel="stylesheet" onerror="this.onerror=null;this.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css';">
    
    <style>
        /* REGLA MAESTRA: TODO EN MAYÚSCULAS */
        body, input, textarea, select, button, a, p, span, div, h1, h2, h3, h4, h5, h6, label, th, td {
            text-transform: uppercase !important;
        }
        ::placeholder {
            text-transform: uppercase !important;
        }

        :root {
            /* Paleta Dark Theme */
            --bg-app: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #0b0f19;
            --glass-panel: #1e293b; 
            --glass-border: #334155; 
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --shadow-soft: 0 4px 6px -1px rgba(0, 0, 0, 0.4), 0 20px 40px -5px rgba(0, 0, 0, 0.5);
            --shadow-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 30px 60px -10px rgba(0, 0, 0, 0.6);
            --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-in-out-smooth: cubic-bezier(0.65, 0, 0.35, 1);
            --ease-water-ripple: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --fire-red: #B91C1C;
        }

        /* Dark Theme Overrides para Tailwind clases quemadas */
        .bg-white { background-color: var(--bg-card) !important; }
        .bg-slate-50 { background-color: var(--bg-input) !important; }
        .bg-slate-100, .bg-slate-200 { background-color: rgba(255,255,255,0.03) !important; }
        .border-slate-50, .border-slate-100, .border-slate-200, .border-slate-300 { border-color: var(--glass-border) !important; }
        .text-slate-400, .text-slate-500, .text-slate-600, .text-slate-700, .text-slate-800 { color: var(--text-main) !important; }
        .hover\:bg-slate-50:hover { background-color: var(--bg-input) !important; }
        .hover\:bg-slate-100:hover, .hover\:bg-white:hover { background-color: rgba(255,255,255,0.08) !important; }
        .hover\:bg-slate-200:hover { background-color: rgba(255,255,255,0.12) !important; }

        body {
            font-family: 'Segoe UI', 'SegoeWP', 'Helvetica Neue', sans-serif;
            background-color: var(--bg-app);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 4rem;
        }

        /* --- PANELES FLOTANTES --- */
        .fluent-card {
            background: var(--glass-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-soft);
            border-radius: 24px;
            transition: transform 0.6s var(--ease-out-expo), box-shadow 0.6s var(--ease-out-expo);
        }

        .fluent-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
            border-color: #cbd5e1;
        }

        /* --- BOTONES MODERNOS --- */
        .btn-fluent {
            position: relative;
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-radius: 16px;
            font-weight: 600;
            letter-spacing: 0.3px;
            overflow: hidden;
            transition: all 0.4s var(--ease-out-expo);
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            font-size: 0.75rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            gap: 6px;
            outline: none;
        }

        .btn-fluent:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.4);
            background: var(--bg-input);
            border-color: var(--fire-red);
        }

        .btn-fluent:active {
            transform: scale(0.97);
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.02);
        }
        
        .btn-fluent:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            filter: grayscale(1);
        }
        .btn-fluent.blue { color: #60a5fa; background: rgba(37, 99, 235, 0.1); border-color: rgba(37, 99, 235, 0.2); }
        .btn-fluent.blue:hover { background: rgba(37, 99, 235, 0.2); box-shadow: 0 8px 20px -5px rgba(37, 99, 235, 0.3); }

        .btn-fluent.red { color: #f87171; background: rgba(220, 38, 38, 0.1); border-color: rgba(220, 38, 38, 0.2); }
        .btn-fluent.red:hover { background: rgba(220, 38, 38, 0.2); box-shadow: 0 8px 20px -5px rgba(220, 38, 38, 0.3); }

        /* --- BOTÓN ORBE (Disparador) --- */
        .orb-container {
            position: relative;
            width: 200px; height: 200px;
            display: flex; justify-content: center; align-items: center;
        }

        .orb-trigger {
            width: 160px; height: 160px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--bg-card), var(--bg-input));
            border: 3px solid var(--fire-red);
            box-shadow: 
                0 0 15px rgba(185, 28, 28, 0.4), 
                0 20px 40px rgba(0, 0, 0, 0.5), 
                inset 0 2px 4px rgba(255, 255, 255, 0.05);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: var(--text-muted); cursor: pointer;
            transition: all 0.6s var(--ease-out-expo);
            position: relative; z-index: 20; outline: none;
        }

        .orb-trigger:hover {
            transform: scale(1.03);
            color: #dc2626;
            border-color: #dc2626;
            box-shadow: 
                0 0 25px rgba(239, 68, 68, 0.3),
                0 30px 50px rgba(0, 0, 0, 0.12);
        }
        
        .orb-trigger:active { transform: scale(0.96); }

        .orb-trigger.active {
            background: var(--bg-card);
            color: #ef4444;
            border-color: #ef4444;
            box-shadow: 
                0 0 0 4px rgba(185, 28, 28, 0.4),
                0 20px 40px rgba(239, 68, 68, 0.25);
        }
        
        .orb-trigger:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
            background: var(--bg-app);
            border-color: var(--glass-border);
        }

        /* --- LOADER EXTERNO (Anillo giratorio) --- */
        .orb-trigger.is-loading {
            cursor: wait !important;
            border-color: rgba(239, 68, 68, 0.1); 
        }
        
        .orb-trigger.is-loading::after {
            content: '';
            position: absolute;
            inset: -3px; 
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: var(--fire-red);
            border-right-color: var(--fire-red);
            animation: spin-soft 1.2s linear infinite;
        }
        @keyframes spin-soft {
            to { transform: rotate(360deg); }
        }

        .orb-trigger i { font-size: 3rem; color: #ef4444; filter: drop-shadow(0 2px 4px rgba(239, 68, 68, 0.1)); }
        .orb-trigger span { color: #7f1d1d; }

        /* --- ONDAS DE ACTIVACIÓN --- */
        .digital-wave {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 100%; height: 100%;
            border-radius: 50%;
            border: 1px solid rgba(239, 68, 68, 0.4);
            background: rgba(239, 68, 68, 0.02);
            opacity: 0; pointer-events: none; z-index: 0;
        }

        .active .digital-wave { 
            animation: water-ripple 4s infinite var(--ease-water-ripple); 
        }
        .active .digital-wave:nth-child(2) { animation-delay: 1.2s; }
        
        @keyframes water-ripple {
            0% { width: 160px; height: 160px; opacity: 0.6; border-width: 2px; }
            100% { width: 600px; height: 600px; opacity: 0; border-width: 0px; }
        }

        /* --- SWITCH DE ESTADO --- */
        .status-container {
            background: var(--bg-card); border-radius: 9999px; padding: 4px;
            display: flex; gap: 4px; border: 1px solid var(--glass-border);
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .status-pill {
            padding: 8px 24px;
            border-radius: 9999px; font-size: 0.8rem; font-weight: 700;
            text-transform: uppercase; cursor: pointer; transition: all 0.4s var(--ease-out-expo);
            color: var(--text-muted); letter-spacing: 1px;
        }
        .status-pill.active-on { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .status-pill.active-off { background: rgba(185, 28, 28, 0.15); color: #ef4444; }
        .status-pill.inactive { background: transparent; color: var(--text-muted); }
        .status-pill.inactive:hover { color: #64748b; }

        /* --- HISTORIAL --- */
        .log-item {
            display: grid; grid-template-columns: 60px 1fr auto; gap: 16px;
            padding: 18px; border-bottom: 1px solid var(--glass-border);
            transition: background 0.3s;
        }
        .log-item:hover { background: var(--bg-input); }
        .log-item:last-child { border-bottom: none; }

        /* --- INPUTS --- */
        .input-fluent {
            width: 100%; padding: 14px; background: var(--bg-input);
            border: 1px solid var(--glass-border); border-radius: 14px;
            color: var(--text-main); outline: none; transition: all 0.4s;
            text-align: center; font-weight: 600; font-size: 0.95rem; text-transform: uppercase;
        }
        .input-fluent:focus { 
            border-color: #3b82f6; 
            background: var(--bg-card); 
            box-shadow: 0 4px 20px rgba(59, 130, 246, 0.15); 
        }

        /* --- TRANSICIONES --- */
        .screen-enter {
            animation: screenEntry 0.8s var(--ease-out-expo) forwards;
            opacity: 0; transform: translateY(30px) scale(0.98);
        }
        @keyframes screenEntry { 
            to { opacity: 1; transform: translateY(0) scale(1); } 
        }

        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }

        .view-transition-container { position: relative; width: 100%; height: auto; }
        .view-content { transition: opacity 0.5s var(--ease-in-out-smooth), transform 0.6s var(--ease-out-expo), filter 0.5s linear; }
        .view-visible { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); pointer-events: auto; position: relative; z-index: 2; }
        .view-hidden { opacity: 0; transform: translateY(15px) scale(0.96); filter: blur(4px); pointer-events: none; position: absolute; top: 0; left: 0; width: 100%; z-index: 1; }

        .secondary-controls { transition: opacity 0.5s ease, transform 0.5s ease; opacity: 1; transform: translateY(0); }
        .secondary-controls.hidden-soft { opacity: 0; transform: translateY(20px); pointer-events: none; position: absolute; }

        #blocked-overlay { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); z-index: 50; transition: opacity 0.5s; }

        .modal-overlay {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(8px); z-index: 100; display: flex;
            align-items: center; justify-content: center; opacity: 0;
            pointer-events: none; transition: opacity 0.5s var(--ease-in-out-smooth);
        }
        .modal-overlay.open { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: var(--bg-card); border: 1px solid var(--glass-border);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.5);
            border-radius: 28px; padding: 2.5rem; width: 90%; max-width: 420px;
            transform: scale(0.92) translateY(20px); transition: transform 0.6s var(--ease-out-expo);
        }
        .modal-overlay.open .modal-content { transform: scale(1) translateY(0); }

        .custom-scroll::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>

    <script>
        // --- REGLA MAESTRA DE MAYÚSCULAS JS ---
        document.addEventListener('input', function(e) {
            if (e.target.tagName === 'TEXTAREA' || (e.target.tagName === 'INPUT' && e.target.type === 'text')) {
                const start = e.target.selectionStart;
                const end = e.target.selectionEnd;
                e.target.value = e.target.value.toUpperCase();
                try { e.target.setSelectionRange(start, end); } catch (err) {}
            }
        });
    </script>

    <!-- SCRIPT TIPO MODULE CON FIREBASE Y SYNC QUEUE -->
    <script>
        try {
            Object.defineProperty(navigator, 'onLine', { get: () => true });
        } catch(e) {
            console.error("Error overriding navigator.onLine:", e);
        }
    </script>
    <script type="module">
        import { initializeApp } from "./libs/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithEmailAndPassword } from "./libs/firebase-auth.js";
        import { getFirestore, doc, setDoc, updateDoc, collection, onSnapshot, getDocs } from "./libs/firebase-firestore.js";

        const firebaseConfig = null;

        window.fbDb = null;
        window.fbDoc = doc;
        window.fbSetDoc = setDoc;
        window.fbUpdateDoc = updateDoc;

        const CACHE_KEY = 'sirena_data_cache';
        
        let currentSystemStatus = "0-9"; 
        let nextId = 1;
        let tempTargetStatus = "";
        
        let isSirenActive = false;
        let isPendingSync = false; 
        let currentActivationId = null;
        let lastStopActionTime = 0; 
        let lastStatusChangeTime = 0; 
        let lastStartActionTime = 0; 

        let isRomeriaActive = false;
        let currentRomeriaId = null;

        // ====== COLA DE SINCRONIZACIÓN OFFLINE-FIRST ======
        window.queueFirebaseWrite = function(type, coll, docId, data, options) {
            if (localStorage.getItem('saas_read_only') === '1') {
                console.warn("Modo Lectura (SaaS): Escritura bloqueada en queueFirebaseWrite (iframe).");
                if (window.showToast) {
                    window.showToast("Modo Lectura - Escrituras deshabilitadas");
                }
                return;
            }
            if (window.self !== window.top && parent) {
                try {
                    if (parent.queueFirebaseWrite) {
                        parent.queueFirebaseWrite(type, coll, docId, data, options);
                        return;
                    }
                } catch (e) {
                    console.warn("Error accessing parent.queueFirebaseWrite in Sirena, falling back to local queue:", e);
                }
            }
            let q = new Array();
            try { 
                const savedQ = localStorage.getItem('sisbom_sync_queue');
                if (savedQ) q = JSON.parse(savedQ); 
            } catch(e){}
            const newItem = new Object({ type: type, coll: coll, docId: docId, data: data, options: options || new Object(), time: Date.now() });
            q.push(newItem);
            localStorage.setItem('sisbom_sync_queue', JSON.stringify(q));
            window.processSyncQueue();
        };

        window.sanitizeForFirebase = function(val) {
            if (val === null || val === undefined) return val;
            if (typeof val === 'function' || (val && val.constructor && val.constructor.name === 'FieldValueImpl')) return val;
            if (Array.isArray(val) || (typeof val === 'object' && typeof val.length === 'number' && Object.prototype.toString.call(val) === '[object Array]')) {
                return Array.from(val).map(window.sanitizeForFirebase);
            }
            if (typeof val === 'object') {
                const ParentObj = (window.parent && window.parent.Object) ? window.parent.Object : Object;
                const clean = new ParentObj();
                for (const k of Object.keys(val)) { Reflect.set(clean, k, window.sanitizeForFirebase(val[k])); }
                return clean;
            }
            return val;
        };

        window.processSyncQueue = async function() {
            if (window.self !== window.top) {
                if (window.parent && window.parent.processSyncQueue) {
                    window.parent.processSyncQueue();
                }
                return;
            }
            if (!navigator.onLine || !window.fbDb || window.isSyncing) return;
            window.isSyncing = true;
            
            while (true) {
                let q = new Array();
                try { 
                    const savedQ = localStorage.getItem('sisbom_sync_queue');
                    if (savedQ) q = JSON.parse(savedQ); 
                } catch(e){}
                
                if (!q || q.length === 0) break;
                
                let item = q.shift();
                localStorage.setItem('sisbom_sync_queue', JSON.stringify(q));
                
                try {
                    const sanitizedData = window.sanitizeForFirebase(item.data);
                    
                    if (item.type === 'set' && window.fbSetDoc) {
                        await window.fbSetDoc(window.fbDoc(window.fbDb, item.coll, item.docId), sanitizedData, item.options);
                    } else if (item.type === 'update' && window.fbSetDoc) {
                        let finalData = new Object();
                        let hasDeleteField = false;
                        for (let k of Object.keys(sanitizedData)) {
                            if (sanitizedData[k] === '__DELETE_FIELD__' && window.fbDeleteField) {
                                Reflect.set(finalData, k, window.fbDeleteField());
                                hasDeleteField = true;
                            } else {
                                Reflect.set(finalData, k, sanitizedData[k]);
                            }
                        }
                        if (hasDeleteField && window.fbUpdateDoc) {
                            await window.fbUpdateDoc(window.fbDoc(window.fbDb, item.coll, item.docId), finalData);
                        } else {
                            await window.fbSetDoc(window.fbDoc(window.fbDb, item.coll, item.docId), finalData, new Object({ merge: true }));
                        }
                    } else if (item.type === 'delete' && window.fbDeleteDoc) {
                        await window.fbDeleteDoc(window.fbDoc(window.fbDb, item.coll, item.docId));
                    }
                } catch(e) {
                    console.warn("Fallo sync item, docId:", item.docId, e);
                    
                    let currentQ = new Array();
                    try { 
                        const savedQ = localStorage.getItem('sisbom_sync_queue');
                        if (savedQ) currentQ = JSON.parse(savedQ); 
                    } catch(ex){}
                    
                    if (!currentQ.some(x => x.time === item.time)) {
                        item.errCount = (item.errCount || 0) + 1;
                        currentQ.unshift(item);
                        localStorage.setItem('sisbom_sync_queue', JSON.stringify(currentQ));
                    }
                    
                    if (e && e.code === 'permission-denied') {
                        if (window.parent && window.parent.authenticateFirebase) {
                            window.parent.authenticateFirebase();
                        }
                    }
                    
                    break;
                }
            }
            window.isSyncing = false;
        };

        window.addEventListener('online', window.processSyncQueue);
        setInterval(window.processSyncQueue, 15000);

        window.initFirebase = async function() {
            if (window.self !== window.top && parent) {
                try {
                    if (parent.fbDb) {
                        window.fbDb = parent.fbDb;
                        window.fbDoc = parent.fbDoc;
                        window.fbSetDoc = parent.fbSetDoc;
                        window.fbUpdateDoc = parent.fbUpdateDoc;
                        window.fbCollection = parent.fbCollection;
                        window.fbOnSnapshot = parent.fbOnSnapshot;
                        window.fbGetDocs = parent.fbGetDocs;
                        window.fbAddDoc = parent.fbAddDoc;
                        window.fbGetDoc = parent.fbGetDoc;
                        window.fbDeleteDoc = parent.fbDeleteDoc;
                        console.log("Firebase inherited from parent in Sirena");
                        window.processSyncQueue();
                        return true;
                    }
                } catch (e) {
                    console.warn("Error inheriting Firebase in Sirena:", e);
                }
            }
            
            return await window.initFirebaseSelf();
        };

        window.initFirebaseSelf = async function() {
            if (window.fbDb) return true;
            try {
                window.fbDoc = doc;
                window.fbSetDoc = setDoc;
                window.fbUpdateDoc = updateDoc;

                let configToUse = null;
                try {
                    const dynamicConfigStr = localStorage.getItem('saas_firebase_config') || localStorage.getItem('firebaseConfig');
                    if (dynamicConfigStr) {
                        configToUse = JSON.parse(dynamicConfigStr);
                    }
                } catch (e) {
                    console.error("Error parsing saas_firebase_config in Sirena:", e);
                }
                if (!configToUse) {
                    console.error("No se encontró configuración de Firebase en Sirena.");
                    return false;
                }
                const app = initializeApp(configToUse);
                const auth = getAuth(app);
                window.fbDb = getFirestore(app);
                
                const storedUser = localStorage.getItem('authUserId');
                const storedPassSecure = localStorage.getItem('authPasswordSecure');
                if (storedUser && storedPassSecure) {
                    const email = storedUser + "@sisbom.com";
                    await signInWithEmailAndPassword(auth, email, storedPassSecure);
                    console.log("Firebase conectado con credenciales en Sirena");
                } else {
                    console.warn("Sin credenciales para autenticar Firebase en Sirena");
                }
                window.processSyncQueue();
                return true;
            } catch(e) {
                console.error("Error Firebase self-init in Sirena:", e);
                return false;
            }
        };

        window.onload = async function() {
            // Wait up to 1000ms for pywebview to be defined
            if (!window.pywebview || !window.pywebview.api) {
                await new Promise(resolve => {
                    let resolved = false;
                    const handleReady = () => {
                        if (!resolved) {
                            resolved = true;
                            window.removeEventListener('pywebviewready', handleReady);
                            resolve();
                        }
                    };
                    window.addEventListener('pywebviewready', handleReady);
                    
                    let elapsed = 0;
                    const interval = setInterval(() => {
                        elapsed += 30;
                        const hasParentNative = (window.parent && window.parent.isNativeApp);
                        if ((window.pywebview && window.pywebview.api) || hasParentNative || elapsed >= 1000) {
                            clearInterval(interval);
                            if (!resolved) {
                                resolved = true;
                                window.removeEventListener('pywebviewready', handleReady);
                                resolve();
                            }
                        }
                    }, 30);
                });
            }

            await window.loadFromCache(); 
            
            let success = await window.initFirebase();
            if (success && window.self !== window.top && parent) {
                if (parent.isFirebaseActiveCentral) {
                    window.setupRealtimeListeners();
                } else {
                    window.onFirebaseParentReady = function() {
                        window.setupRealtimeListeners();
                    };
                }
            } else if (!success && window.self !== window.top) {
                let attempts = 0;
                const interval = setInterval(async () => {
                    attempts++;
                    success = await window.initFirebase();
                    if (success) {
                        clearInterval(interval);
                        if (parent && parent.isFirebaseActiveCentral) {
                            window.setupRealtimeListeners();
                        } else {
                            window.onFirebaseParentReady = function() {
                                window.setupRealtimeListeners();
                            };
                        }
                    } else if (attempts >= 10) { // Retry for 5 seconds (10 attempts * 500ms)
                        clearInterval(interval);
                        console.log("Parent Firebase not ready after 5s. Falling back to self-initialization in Sirena.");
                        const fallbackSuccess = await window.initFirebaseSelf();
                        if (fallbackSuccess) {
                            window.setupRealtimeListeners();
                        } else {
                            console.error("Failed to self-initialize Firebase in Sirena fallback.");
                        }
                    }
                }, 500);
            } else {
                window.setupRealtimeListeners();
            }

            window.addEventListener("storage", function(e) {
                if (e.key === CACHE_KEY || e.key === null || e.key === undefined) {
                    window.loadFromCache();
                }
            });
        };

        let unsubSirena = null;

        window.onFirebaseParentLogout = function() {
            console.log("Firebase Parent Logout event received in Sirena.");
            if (unsubSirena) {
                try { unsubSirena(); } catch(e) {}
                unsubSirena = null;
            }

        window.setupRealtimeListeners = function() {
            if (window.self !== window.top) {
                console.log("Bloqueando setupRealtimeListeners: Estamos en un Iframe (Central de Alarmas).");
                return;
            }
            const btnIcon = document.querySelector('#btn-refresh i');
            if(btnIcon) btnIcon.classList.add('fa-spin');

            if (unsubSirena) {
                try { unsubSirena(); } catch(e) {}
                unsubSirena = null;
            }

            unsubSirena = window.fbOnSnapshot(window.fbCollection(window.fbDb, 'sirena'), (snap) => {
                let logs = new Array();
                snap.forEach(docSnap => {
                    let data = docSnap.data();
                    data.idToqueSirena = data.idToqueSirena || docSnap.id;
                    logs.push(data);
                });
                
                localStorage.setItem(CACHE_KEY, JSON.stringify(logs));
                window.renderLogs(logs);
                
                if(btnIcon) btnIcon.classList.remove('fa-spin');
            }, (error) => {
                console.error(error);
                window.showToast("Error de conexión en vivo.", "error");
                if(btnIcon) btnIcon.classList.remove('fa-spin');
                unsubSirena = null;
                if (error.code === 'permission-denied' && localStorage.getItem('adminUser')) {
                    setTimeout(() => {
                        if (window.parent && window.parent.authenticateFirebase) {
                            window.parent.authenticateFirebase();
                        }
                        window.setupRealtimeListeners();
                    }, 5000);
                }
            });
        };

            toast.className = `transform transition-all duration-300 translate-y-full opacity-0 max-w-sm w-full shadow-lg rounded-lg pointer-events-auto flex ring-1 ring-black ring-opacity-5 ${bg} text-white`;
            
            toast.innerHTML = `<div class="p-4 w-full flex items-center gap-3">
                ${type === 'success' ? '<i class="fas fa-check-circle text-lg"></i>' : (type === 'info' ? '<i class="fas fa-info-circle text-lg text-blue-400"></i>' : '<i class="fas fa-times-circle text-lg"></i>')}
                <p class="text-sm font-medium">${message}</p>

            container.appendChild(toast);

        window.cleanData = function(val) {
            if (val === undefined || val === null) return '';
            return String(val).replace(new RegExp('\'|"', 'g'), '').trim();
        };

        window.renderLogs = function(logs) {
            const container = document.getElementById('history-list');
            const todayStr = window.getFormattedDate(new Date()); 
            
            if (logs.length > 0) {
                const maxId = logs.reduce((max, l) => Math.max(max, parseInt(window.cleanData(l.idToqueSirena)) || 0), 0);
                nextId = maxId + 1;
                
                logs.sort((a, b) => (parseInt(window.cleanData(b.idToqueSirena)) || 0) - (parseInt(window.cleanData(a.idToqueSirena)) || 0));
                
                const lastLog = logs.at(0);
                
                const timeSinceStatusChange = Date.now() - lastStatusChangeTime;
                const isRecentlyChanged = lastStatusChangeTime > 0 && timeSinceStatusChange < 30000; 

                if (!isRecentlyChanged) {
                    if (lastLog.estado) window.updateUIStatus(lastLog.estado);
                }

                const lastEnServicio = window.cleanData(lastLog.enServicio);
                
                if (lastEnServicio === '1' || lastEnServicio === '2') {
                    const timeSinceStop = Date.now() - lastStopActionTime;
                    const isRecentlyStopped = lastStopActionTime > 0 && timeSinceStop < 6000;

                    if (!isSirenActive && !isPendingSync && !isRomeriaActive && !isRecentlyStopped) {
                        currentActivationId = lastLog.idToqueSirena;
                        window.setSirenVisuals(true, lastLog.razonDeToque);
                    }
                } else {
                    const timeSinceStart = Date.now() - lastStartActionTime;
                    const isRecentlyStarted = lastStartActionTime > 0 && timeSinceStart < 10000;

                    if (isSirenActive && !isPendingSync && !isRomeriaActive && !isRecentlyStarted) {
                        window.setSirenVisuals(false);
                    }
                }
            } else {
                nextId = 1;
                const timeSinceStatusChange = Date.now() - lastStatusChangeTime;
                if (!lastStatusChangeTime || timeSinceStatusChange > 30000) {
                    window.updateUIStatus("0-9");
                }
            }

            const todaysLogs = logs.filter(log => window.cleanData(log.fechaDeToque) === todayStr);

            if (todaysLogs.length === 0) {
                container.innerHTML = '<div class="text-center text-slate-400 text-xs py-20 font-medium">Sin registros hoy.</div>';
            } else {
                container.innerHTML = todaysLogs.map(log => {
                    const time = window.cleanData(log.horaDeToque);
                    const date = window.cleanData(log.fechaDeToque);
                    const reason = log.razonDeToque || '---';
                    const st = window.cleanData(log.estado);
                    const rawEnServicio = window.cleanData(log.enServicio);
                    const isActiveRinging = (rawEnServicio === '1' || rawEnServicio === '2');
                    const didSound = window.cleanData(log.sono) === '1';

                    let iconHtml = didSound 
                        ? (isActiveRinging ? '<div class="w-8 h-8 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center text-xs animate-pulse border border-red-500/30"><i class="fas fa-volume-up"></i></div>' : '<div class="w-8 h-8 rounded-full bg-green-500/20 text-green-400 flex items-center justify-center text-xs border border-green-100"><i class="fas fa-check"></i></div>')
                        : '<div class="w-8 h-8 rounded-full bg-slate-500/20 text-slate-400 flex items-center justify-center text-xs border border-slate-200"><i class="fas fa-info"></i></div>';
                    
                    const activeClass = isActiveRinging ? "bg-red-900/30 border-l-4 border-l-red-500" : "";

                    return `
                        <div class="log-item ${activeClass}">
                            <div class="flex flex-col">
                                <span class="text-lg font-light text-slate-800 leading-none">${time}</span>
                                <span class="font-bold text-slate-500" style="font-size: 9px;">${date}</span>
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-xs font-bold text-slate-700 uppercase truncate tracking-wide">${reason}</div>
                                <div class="text-slate-500 font-medium" style="font-size: 9px;">Estado: ${st} ${isActiveRinging ? '<span class="text-red-400 ml-1 font-bold animate-pulse">● SONANDO</span>' : ''}</div>
                            </div>
                            ${iconHtml}
                        </div>`;
                }).join('');
            }
        };

        function checkIsNative() {

        window.loadFromCache = async function() {
            let cachedData = localStorage.getItem(CACHE_KEY);
            if (!cachedData && !checkIsNative()) {
                try {
                    const res = await fetch('./db_sirena.json');
                    if (res.ok) {
                        const data = await res.json();
                        localStorage.setItem(CACHE_KEY, JSON.stringify(data));
                        cachedData = localStorage.getItem(CACHE_KEY);
                    }
                } catch(e) {}
            }
            if (cachedData) {
                try {
                    const data = JSON.parse(cachedData);
                    window.renderLogs(data);
                } catch (e) { console.error("Error caché", e); }
            }
        };

            isSirenActive = false;

            if (currentRomeriaId) {
                try {
                    window.queueFirebaseWrite('update', 'sirena', currentRomeriaId, new Object({

        window.requestActivation = function(reasonType) {
            if(window.cleanData(currentSystemStatus) === '0-8') return window.showToast("El sistema está Fuera de Servicio (0-8)", "error");
            
            if((reasonType === 'MANUAL' || reasonType === '12-4 TOQUE DE SIRENA') && isSirenActive) {
                if (isRomeriaActive) window.stopRomeria();
                else window.forceStopSiren(false);
                return;
            }
            
            if (isSirenActive && reasonType !== 'MANUAL' && reasonType !== 'ROMERÍA' && reasonType !== '12-4 TOQUE DE SIRENA') return window.showToast("La sirena está activa. Deténgala primero.", "error");

            const input = document.getElementById('confirm-reason');
            input.value = (reasonType === 'MANUAL') ? "" : reasonType;
            window.toggleInternalView(true);
            if(reasonType === 'MANUAL' || reasonType.includes('PRUEBA')) input.focus(); 
        };

        window.forceStopSiren = async function(isAuto) {
            isSirenActive = false;
            isPendingSync = false;
            window.setSirenVisuals(false);
            
            lastStopActionTime = Date.now();

            if (currentActivationId) {
                try {
                    window.queueFirebaseWrite('update', 'sirena', currentActivationId, new Object({
                        enServicio: '0'
                    }));
                } catch(e) { console.error(e); }
            }
        };

        window.attemptStatusChange = function(targetStatus) {
            if (isSirenActive) return window.showToast("La sirena está activa. Deténgala primero.", "error");

            const cleanCurrent = currentSystemStatus.replace(new RegExp('\'', 'g'), '');
            if(cleanCurrent === targetStatus) return;
            tempTargetStatus = targetStatus;
            
            const msgElement = document.getElementById('status-confirm-msg');
            
            if (targetStatus === '0-8') {
                msgElement.innerText = "¿Seguro quiere dejar fuera de servicio la sirena?";
                msgElement.className = "text-sm text-red-500 font-bold mb-4 text-center leading-relaxed";
            } else {
                msgElement.innerText = "¿Confirma poner en servicio la sirena?";
                msgElement.className = "text-sm text-blue-600 font-bold mb-4 text-center leading-relaxed";
            }

            document.getElementById('status-reason').value = "";
            document.getElementById('status-modal').classList.add('open');
        };

        window.executeStatusChange = async function() {
            const btn = document.getElementById('btn-status-exec');
            btn.disabled = true; 
            btn.innerText = "Cambiando...";

            const reasonInput = document.getElementById('status-reason').value;
            let finalReason = reasonInput.trim();
            if (!finalReason) finalReason = "CAMBIO DE ESTADO A " + tempTargetStatus;
            else finalReason = finalReason.toUpperCase();

            const now = new Date();
            const payload = new Object({
                idToqueSirena: String(nextId),
                fechaDeToque: window.getFormattedDate(now),
                horaDeToque: window.getFormattedTime(now),
                razonDeToque: finalReason,
                estado: tempTargetStatus,
                enServicio: '0',
                sono: '0'
            });

            window.updateUIStatus(tempTargetStatus);
            window.closeModal('status-modal');
            window.showToast("Sistema ahora en " + tempTargetStatus, "success");
            
            lastStatusChangeTime = Date.now();

            setTimeout(() => {
                btn.disabled = false; 
                btn.innerText = "Aceptar";
            }, 500); 

            try {
                window.queueFirebaseWrite('set', 'sirena', String(nextId), payload);
                nextId++;
            } catch(e) { console.error("Fallo envío estado", e); }
        };

        window.getFormattedDate = function(d) {
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            return `${dd}-${mm}-${d.getFullYear()}`;
        };

        window.getFormattedTime = function(d) {
            const hh = String(d.getHours()).padStart(2, '0');
            const mm = String(d.getMinutes()).padStart(2, '0');
            return `${hh}:${mm}`;
        };
    </script>

    <!-- Right-click block injected for definitive release V1.1.0 -->
    <script>
    document.addEventListener('contextmenu', e => {
        const tag = e.target.tagName;
        if (tag !== 'INPUT' && tag !== 'TEXTAREA' && !e.target.isContentEditable) {
            e.preventDefault();
        }
    });
    </script>
