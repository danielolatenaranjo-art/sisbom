            }
        };

        window.updateTotals = function(allPersonnel) {
            const active = allPersonnel.filter(p => window.isTrueValue(p.activo !== undefined ? p.activo : '1'));
            
            // Para la central, un bombero está "Disponible" si no tiene ninguno de los estados bloqueantes o asignaciones manuales.
            const isAvailable = (p) => !window.isPersonSuspended(p) && !window.isPersonCds(p) && !window.isPersonPermiso(p) && !window.isPersonLicencia(p) && !window.isPersonOperador(p) && !window.isHonorary(p);

            const count09 = active.filter(p => (String(p.estado).trim() === '0-9' || window.isInServiceValue(p.enServicio)) && isAvailable(p)).length;
            const driversAvailable = active.filter(p => window.isTrueValue(p.conductor) && (String(p.estado).trim() === '0-9' || window.isInServiceValue(p.enServicio)) && isAvailable(p)).length;
            
            // Los 0-8 suman a quienes tengan estado 0-8 manualmente, o quienes tengan algún estado limitante (CDS, PERMISO, LICENCIA, OPERADOR) o sean Honorarios.
            const count08 = active.filter(p => (String(p.estado).trim() === '0-8' && !window.isInServiceValue(p.enServicio)) || !isAvailable(p) || window.isHonorary(p)).length;

            document.getElementById('count-total').innerText = active.length;
            document.getElementById('count-drivers-09').innerText = driversAvailable; 
            document.getElementById('count-09').innerText = count09;
            document.getElementById('count-08').innerText = count08;
        };

        window.syncSearchGrid = function(list) {
            const grid = document.getElementById('search-grid');
            if(!grid) return;
            const existingIds = new Set();
            
            list.forEach(p => {
                const cardId = `search-card-${p.idRegistro}`;
                existingIds.add(cardId);
                window.updateOrCreateCard(grid, p, cardId, false); 
            });
            
            Array.from(grid.children).forEach(child => {
                if (!existingIds.has(child.id)) child.remove();
            });
        };

        window.syncSection = function(secId, gridId, countId, list) {
            const sec = document.getElementById(secId);
            const grid = document.getElementById(gridId);
            
            if (list.length === 0) {
                sec.style.display = 'none';
                return;
            }
            sec.style.display = 'block';
            if(document.getElementById(countId) && countId !== 'count-header-honorary') {
                // Solo actualizamos el contador normal si no es el de honorarios (ese lo actualizamos en renderGrid)
            }

            const existingIds = new Set();
            list.forEach((p, idx) => {
                const cardId = `card-${p.idRegistro}`;
                existingIds.add(cardId);
                window.updateOrCreateCard(grid, p, cardId, true); 
            });

            Array.from(grid.children).forEach(child => {
                if (!existingIds.has(child.id)) child.remove();
            });
        };

        window.updateOrCreateCard = function(grid, p, cardId, allowCompactEvents) {
            let card = document.getElementById(cardId);
            
            const suspended = window.isPersonSuspended(p);
            const licenciaActive = window.isPersonLicencia(p);
            const cdsActive = window.isPersonCds(p);
            const permisoActive = window.isPersonPermiso(p);
            const operadorActive = window.isPersonOperador(p);
            const isHonorary = window.isHonorary(p);
            const serviceIdVal = String(p.enServicio).trim();
            const isNoAsistir = serviceIdVal.startsWith('-');
            const isInService = window.isInServiceValue(serviceIdVal) && !isNoAsistir;

            // Bloqueo total visual para acciones obligatorias de sistema o si es Honorario
            const isForced08 = window.isSpecialState(p) || isHonorary; 
            const is09 = isForced08 ? false : (isInService ? true : String(p.estado).trim() === '0-9');
            
            let statusClass, statusText, cardAttr;
            if (isHonorary) { statusClass="text-status-08"; statusText="HONORARIO (0-8)"; cardAttr="0-8"; }
            else if (suspended) { statusClass="text-status-susp"; statusText="SUSPENDIDO"; cardAttr="suspendido"; }
            else if (licenciaActive) { statusClass="text-status-licencia"; statusText="LICENCIA MÉDICA"; cardAttr="licencia"; }
            else if (permisoActive) { 
                statusClass="text-status-perm"; 
                const razon = p.tipoPermiso ? ` - ${p.tipoPermiso.toUpperCase()}` : "";
                statusText=`PERMISO${razon}`; 
                cardAttr="permiso"; 
            }
            else if (cdsActive) { statusClass="text-status-cds"; statusText="COMISIÓN DE SERVICIO"; cardAttr="cds"; }
            else if (operadorActive) { statusClass="text-status-operador"; statusText="OPERADOR DE CENTRAL"; cardAttr="operador"; }
            else if (isInService) { 
                statusClass="text-status-serv"; 
                const serviceKey = dispatchesMap.get(serviceIdVal) || "GENERAL";
                statusText=`EN ACTO: ${serviceKey}`;
                cardAttr="en-servicio"; 
            }
            else if (isNoAsistir) {
                statusClass="text-status-no-asistir";
                const rejectedSvcId = serviceIdVal.substring(1);
                const serviceKey = dispatchesMap.get(rejectedSvcId) || "GENERAL";
                statusText=`NO ASISTIRÁ: ${serviceKey}`;
                cardAttr="no-asistir";
            }
            else if (String(p.estado).trim().toUpperCase() === 'NO ASISTIR') {
                statusClass="text-status-no-asistir";
                statusText="NO ASISTIR";
                cardAttr="no-asistir";
            }
            else if (is09) { statusClass="text-status-09"; statusText="DISPONIBLE"; cardAttr="0-9"; }
            else { statusClass="text-status-08"; statusText="NO DISPONIBLE"; cardAttr="0-8"; }

            // Lógica de activación de los botones de la UI (0-9, CDS, PERM, LIC, 0-8)
            const cls09 = is09 && !cdsActive && !permisoActive && !licenciaActive && !operadorActive && !isHonorary ? 'active-ok' : '';
            let clsCds = '';
            let clsPerm = '';
            let clsLicencia = '';
            let cls08 = '';

            if (suspended) cls08 = 'active-susp';
            else if (isHonorary) cls08 = 'active-bad'; // Honorario siempre se muestra como 0-8 activado
            else if (licenciaActive) clsLicencia = 'active-licencia';
            else if (permisoActive) clsPerm = 'active-perm';
            else if (cdsActive) clsCds = 'active-cds';
            else if (!is09 && !isInService && !isNoAsistir && !operadorActive) cls08 = 'active-bad';
            
            // Los botones quedan inhabilitados SOLO si hay un castigo/licencia que lo fuerce desde BD,
            // si está metido en una emergencia (asistiendo o no asistiendo), o si es el Operador activo, si es Honorario, o si no hay sesión activa.
            const isDisabled = isForced08 || isInService || !localStorage.getItem('authUserId');
            
            const shortName = window.formatShortName(p.nombreBombero);

            if (!card) {
                card = document.createElement('div');
                card.id = cardId;
                card.className = "card animate-enter card-status-" + cardAttr;
                
                if (allowCompactEvents) {
                    card.onclick = function(e) { 
                        if (viewMode === 'compact') {
                            window.handleCompactClick(this, p.idRegistro);
                        } else if (viewMode === 'visual') {
                            window.openVisualStatusModal(p.idRegistro);
                        }
                    };
                    card.onmouseleave = function(e) { 
                        if (viewMode === 'compact') {
                            window.resetCompactCard(this); 
                        }
                    };
                }
                
                const drvDisplay = window.isTrueValue(p.conductor) ? 'inline-flex' : 'none';
                
                let serviceKeyVal = "";
                if(isInService) {
                    serviceKeyVal = dispatchesMap.get(serviceIdVal) || "GENERAL";
                } else if(isNoAsistir) {
                    serviceKeyVal = dispatchesMap.get(serviceIdVal.substring(1)) || "GENERAL";
                }
                card.setAttribute('data-service-key', serviceKeyVal);
                
                card.innerHTML = `
                    <div class="card-left">
                        <img src="${p.foto || DEFAULT_LOGO}" class="card-img" onerror="this.src='${DEFAULT_LOGO}'">
                        <span class="compact-id">${p.idRadial || '--'}</span>
                    </div>
                    
                    <div class="confirmation-overlay"></div>

                    <div class="visual-content">
                        <span class="visual-id">${p.idRadial || '--'}</span>
                        <span class="visual-name" title="${p.nombreBombero}">${shortName}</span>
                        <span class="visual-status">${statusText.replace('EN ACTO: ', '').replace('NO ASISTIRÁ: ', '')}</span>
                    </div>

                    <div class="card-right">
                        <div>
                            <h4 class="card-name" title="${p.nombreBombero}">
                                <span class="font-black text-sky-400 text-xl">${p.idRadial || '--'}</span>
                                <span class="mx-1.5 text-slate-300 text-lg">&bull;</span>
                                <span>${shortName}</span>
                            </h4>
                            <div class="mt-1 flex flex-wrap gap-2 items-center">
                                <span class="badge-driver" style="display: ${drvDisplay}"><i class="fas fa-steering-wheel"></i> CONDUCTOR</span>
                                <span class="status-text ${statusClass}">${statusText}</span>
                            </div>
                        </div>
                        <div class="flex flex-col gap-1 w-full mt-auto pt-2">
                            <div class="flex gap-1 w-full">
                                <button class="btn-chip btn-09 ${cls09}" onclick="event.stopPropagation(); window.changeStatus('${p.idRegistro}', '0-9')" ${isDisabled ? 'disabled' : ''}><i class="fas fa-check"></i> 0-9</button>
                                <button class="btn-chip btn-08 ${cls08}" onclick="event.stopPropagation(); window.changeStatus('${p.idRegistro}', '0-8')" ${isDisabled ? 'disabled' : ''}><i class="fas fa-ban"></i> 0-8</button>
                            </div>
                            <div class="flex gap-1 w-full">
                                <button class="btn-chip btn-cds ${clsCds}" onclick="event.stopPropagation(); window.changeStatus('${p.idRegistro}', 'CDS')" ${isDisabled ? 'disabled' : ''}><i class="fas fa-briefcase"></i> C.D.S.</button>
                                <button class="btn-chip btn-perm ${clsPerm}" onclick="event.stopPropagation(); window.changeStatus('${p.idRegistro}', 'PERMISO')" ${isDisabled ? 'disabled' : ''}><i class="fas fa-file-signature"></i> PERM.</button>
                                <button class="btn-chip btn-licencia ${clsLicencia}" onclick="event.stopPropagation(); window.changeStatus('${p.idRegistro}', 'LICENCIA')" ${isDisabled ? 'disabled' : ''}><i class="fas fa-notes-medical"></i> L.M.</button>
                            </div>
                        </div>
                    </div>`;
                grid.appendChild(card);
            } else {
                if (card.parentNode !== grid) grid.appendChild(card);
                
                if(!card.className.includes('confirming-')) {
                    if(card.dataset.status !== cardAttr) {
                        card.dataset.status = cardAttr;
                        card.className = "card animate-enter card-status-" + cardAttr;
                    }
                    
                    let serviceKeyVal = "";
                    if(isInService) {
                        serviceKeyVal = dispatchesMap.get(serviceIdVal) || "GENERAL";
                    }
                    if(card.getAttribute('data-service-key') !== serviceKeyVal) {
                        card.setAttribute('data-service-key', serviceKeyVal);
                    }

                    const stText = card.querySelector('.status-text');
                    if(stText && stText.innerText !== statusText) stText.innerText = statusText;
                    if(stText) stText.className = `status-text ${statusClass}`;

                    const visStatus = card.querySelector('.visual-status');
                    if (visStatus && visStatus.innerText !== statusText.replace('EN ACTO: ', '')) {
                        visStatus.innerText = statusText.replace('EN ACTO: ', '');
                    }
                    const visName = card.querySelector('.visual-name');
                    if (visName && visName.innerText !== shortName) {
                        visName.innerText = shortName;
                    }

                    const btn09 = card.querySelector('.btn-09');
                    if (btn09) {
                        const newClass09 = `btn-chip btn-09 ${cls09}`;
                        if(btn09.className !== newClass09) btn09.className = newClass09;
                        btn09.disabled = isDisabled;
                    }

                    const btnCds = card.querySelector('.btn-cds');
                    if (btnCds) {
                        const newClassCds = `btn-chip btn-cds ${clsCds}`;
                        if(btnCds.className !== newClassCds) btnCds.className = newClassCds;
                        btnCds.disabled = isDisabled;
                    }

                    const btnPerm = card.querySelector('.btn-perm');
                    if (btnPerm) {
                        const newClassPerm = `btn-chip btn-perm ${clsPerm}`;
                        if(btnPerm.className !== newClassPerm) btnPerm.className = newClassPerm;
                        btnPerm.disabled = isDisabled;
                    }

                    const btnLicencia = card.querySelector('.btn-licencia');
                    if (btnLicencia) {
                        const newClassLicencia = `btn-chip btn-licencia ${clsLicencia}`;
                        if(btnLicencia.className !== newClassLicencia) btnLicencia.className = newClassLicencia;
                        btnLicencia.disabled = isDisabled;
                    }

                    const btn08 = card.querySelector('.btn-08');
                    if (btn08) {
                        const newClass08 = `btn-chip btn-08 ${cls08}`;
                        if(btn08.className !== newClass08) btn08.className = newClass08;
                        btn08.disabled = isDisabled;
                    }
                }
            }
        };

        // --- FUNCIONES MODO VISUAL (MODAL ESTADOS) ---
        window.visualSelectedId = null;

        window.openVisualStatusModal = function(idRegistro) {
            if (!localStorage.getItem('authUserId')) return;
            const p = personnel.find(per => String(per.idRegistro) === String(idRegistro));
            if (!p) return;

            const enServicioVal = String(p.enServicio || '').trim();
            const isReallyInService = window.isInServiceValue(enServicioVal) && !enServicioVal.startsWith('-');
            if (window.isSpecialState(p) || isReallyInService || window.isHonorary(p)) {
                return;
            }

            window.visualSelectedId = idRegistro;
            document.getElementById('visual-select-name').innerText = window.formatShortName(p.nombreBombero);

            const modal = document.getElementById('status-select-modal');
            const content = document.getElementById('status-select-content');
            document.body.classList.add('overflow-hidden');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        };

        window.closeVisualStatusModal = function() {
            const modal = document.getElementById('status-select-modal');
            const content = document.getElementById('status-select-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                document.body.classList.remove('overflow-hidden');
                window.visualSelectedId = null;
            }, 200);
        };

        window.confirmVisualStatusChange = function(newStatus) {
            if (window.visualSelectedId) {
                window.changeStatus(window.visualSelectedId, newStatus);
            }
            window.closeVisualStatusModal();
        };

        window.changeStatus = async function(idRegistro, newStatus) {
            if (!localStorage.getItem('authUserId')) return;
            const p = personnel.find(per => String(per.idRegistro) === String(idRegistro));
            if (!p || window.isSpecialState(p) || window.isHonorary(p)) return;
            
            const serviceIdVal = String(p.enServicio).trim();
            const inService = window.isInServiceValue(serviceIdVal) && !serviceIdVal.startsWith('-');
            if (inService) return;

            if (String(p.estado).trim() === newStatus) return;

            p.estado = newStatus;
            
            const isOffline = !navigator.onLine;
            if (isOffline) {
                p.offlineModified = true;
                p.lastUpdateLocal = 0;
            } else {
                p.offlineModified = false;
                p.lastUpdateLocal = Date.now(); 
            }
            
            window.updateLocalStorage(); 
            window.renderGrid(); 

            if (!isOffline) {
                window.queueFirebaseWrite('update', 'personal', String(idRegistro), new Object({ 
                    estado: newStatus
                }));

                try {
                    const now = new Date();
                    const dStr = `${String(now.getDate()).padStart(2, '0')}-${String(now.getMonth() + 1).padStart(2, '0')}-${now.getFullYear()}`;
                    const tStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
                    
                    const nextIdStr = String(Date.now());

                    window.queueFirebaseWrite('set', `personal/${idRegistro}/estados`, nextIdStr, new Object({
                        estado: newStatus,
                        fecha: dStr,
                        hora: tStr,
                        idEstado: nextIdStr,
                        timestamp: Date.now()
                    }));
                } catch (e) {
                    console.error("Error guardando historial de estado:", e);
                }
            }
        };
    </script>

    <!-- Right-click block injected for definitive release V1.1.0 -->
    <script>
    document.addEventListener('contextmenu', e => {
        const tag = e.target.tagName;
        if (tag !== 'INPUT' && tag !== 'TEXTAREA' && !e.target.isContentEditable) {
            e.preventDefault();
        }
    });
    </script>
